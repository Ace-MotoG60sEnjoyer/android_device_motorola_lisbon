name: TWRP Recovery Builder - Moto G60S (lisbon)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build TWRP by Ace-MotoG60sEnjoyer
    runs-on: ubuntu-20.04

    steps:
    - name: Clean Up Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialize environment
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc repo

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize TWRP Manifest
      run: |
        mkdir workspace
        cd workspace
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11 --depth=1

    - name: Sync Repositories
      run: |
        cd workspace
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd workspace
        git clone https://github.com/Ace-MotoG60sEnjoyer/android_device_motorola_lisbon.git -b main device/motorola/lisbon

    - name: Building Recovery
      run: |
        cd workspace
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch twrp_lisbon-userdebug
        make recoveryimage -j$(nproc --all)

    - name: Upload Recovery Image
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-MotoG60s-lisbon
        path: |
          workspace/out/target/product/lisbon/*.img
          workspace/out/target/product/lisbon/ramdisk*
